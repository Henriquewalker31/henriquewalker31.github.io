<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | Henrique Walker</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0b1220" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio-theme');
        document.documentElement.dataset.theme = saved || 'dark';
      } catch (error) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <main class="notfound">
    <div class="notfound-inner">
      <span class="brand-mark" aria-hidden="true"><svg class="icon" aria-hidden="true"><use href="#i-logo"/></svg></span>
      <p class="notfound-code">404</p>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou foi movido. Volte ao início para continuar navegando.</p>
      <div class="notfound-actions">
        <a class="btn btn-primary" href="/">Voltar ao início</a>
        <a class="btn btn-outline" href="/#projetos">Ver projetos</a>
      </div>
    </div>
  </main>
</body>
</html>
